<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="mayurBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#053C8F" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <rect width="600" height="750" fill="url(#mayurBg)" />
  
  <!-- Architectural Subtle Grid Lines -->
  <line x1="60" y1="0" x2="60" y2="750" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="540" y1="0" x2="540" y2="750" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="0" y1="690" x2="600" y2="690" stroke="#E2E8F0" stroke-width="1" />
  
  <!-- Subtle Monogram Medallion -->
  <circle cx="300" cy="320" r="110" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <circle cx="300" cy="320" r="98" fill="url(#goldAccent)" />
  
  <!-- Executive Silhouette Graphic -->
  <g transform="translate(300, 310)" fill="#053C8F" opacity="0.45">
    <circle cx="0" cy="-28" r="28" />
    <path d="M -50,45 C -50,12 -30,0 0,0 C 30,0 50,12 50,45 Z" />
  </g>
  
  <!-- Monogram Initials -->
  <text x="300" y="475" font-family="'Montserrat', 'Cinzel', -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="8" fill="#053C8F" text-anchor="middle">MAYUR BORA</text>
  <text x="300" y="505" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500" letter-spacing="4" fill="#94A3B8" text-anchor="middle">BORA GROUP</text>
</svg>
